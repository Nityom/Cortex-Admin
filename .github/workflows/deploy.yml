name: Deploy Cortex-Admin to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Next.js Static Export
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://jovial-sheep-76.convex.cloud' }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL || 'https://jovial-sheep-76.convex.site' }}
        run: npm run build

      - name: 🔧 Normalize FTP Settings
        id: ftp
        run: |
          # 1. Clean Server Address (strip ftp:// or http:// prefix and any trailing slashes)
          RAW_SERVER="${{ secrets.HOSTINGER_FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z]*://||' -e 's|/*$||')
          if [ -z "$CLEAN_SERVER" ]; then
            CLEAN_SERVER="82.25.120.113"
          fi
          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"

          # 2. Clean Server Directory (MUST end with /)
          # For Hostinger subdomain FTP accounts, the root is already public_html, so ./ is the correct target.
          RAW_DIR="${{ secrets.HOSTINGER_SERVER_DIR }}"
          if [ -z "$RAW_DIR" ] || [ "$RAW_DIR" = "public_html" ] || [ "$RAW_DIR" = "public_html/" ] || [ "$RAW_DIR" = "." ] || [ "$RAW_DIR" = "./" ]; then
            CLEAN_DIR="./"
          else
            NORMALIZED_DIR=$(echo "$RAW_DIR" | sed -e 's|^/*||' -e 's|/*$||')
            CLEAN_DIR="${NORMALIZED_DIR}/"
          fi
          echo "dir=$CLEAN_DIR" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          local-dir: ./out/
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: false
          exclude: |
            **/*.map
            **/IMG_09*.png
